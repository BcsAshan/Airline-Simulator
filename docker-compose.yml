# Local stack: infrastructure + all Phase 1 services. Gateway on http://localhost:5000
# Seq UI http://localhost:5341 · RabbitMQ UI http://localhost:15672 (guest/guest) · Jaeger http://localhost:16686 · Mailpit http://localhost:8025
name: pss

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__Redis: redis:6379
  RabbitMq__Host: rabbitmq
  Seq__Url: http://seq:5341
  Otel__Endpoint: http://jaeger:4317
  Services__Identity: http://identity:8080
  Services__RefData: http://refdata:8080
  Services__Inventory: http://inventory:8080
  Services__Pricing: http://pricing:8080
  Services__Shopping: http://shopping:8080
  Services__Booking: http://booking:8080
  Services__Payment: http://payment:8080

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Pss_Dev_Passw0rd!"
    ports: ["1433:1433"]
    volumes: ["sqldata:/var/opt/mssql"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      # Seq 2024.1+ exits on first run unless an admin password is set or authentication is disabled (local dev only).
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports: ["5341:80"]

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  identity:
    build:
      context: .
      args:
        PROJECT: src/Services/Identity/Pss.Identity.Api/Pss.Identity.Api.csproj
        DLL: Pss.Identity.Api.dll
    environment:
      <<: *service-env
      ConnectionStrings__Sql: "Server=sqlserver,1433;Database=Pss_Identity;User Id=sa;Password=Pss_Dev_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
      Jwt__KeyPath: /keys/identity-signing-key.pem
    volumes: ["identitykeys:/keys"]
    depends_on: [redis, rabbitmq, sqlserver]

  refdata:
    build:
      context: .
      args:
        PROJECT: src/Services/RefData/Pss.RefData.Api/Pss.RefData.Api.csproj
        DLL: Pss.RefData.Api.dll
    environment:
      <<: *service-env
      ConnectionStrings__Sql: "Server=sqlserver,1433;Database=Pss_RefData;User Id=sa;Password=Pss_Dev_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
    depends_on: [redis, rabbitmq, sqlserver]

  inventory:
    build:
      context: .
      args:
        PROJECT: src/Services/Inventory/Pss.Inventory.Api/Pss.Inventory.Api.csproj
        DLL: Pss.Inventory.Api.dll
    environment:
      <<: *service-env
      ConnectionStrings__Sql: "Server=sqlserver,1433;Database=Pss_Inventory;User Id=sa;Password=Pss_Dev_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
    depends_on: [redis, rabbitmq, sqlserver]

  pricing:
    build:
      context: .
      args:
        PROJECT: src/Services/Pricing/Pss.Pricing.Api/Pss.Pricing.Api.csproj
        DLL: Pss.Pricing.Api.dll
    environment:
      <<: *service-env
      ConnectionStrings__Sql: "Server=sqlserver,1433;Database=Pss_Pricing;User Id=sa;Password=Pss_Dev_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
    depends_on: [redis, rabbitmq, sqlserver]

  shopping:
    build:
      context: .
      args:
        PROJECT: src/Services/Shopping/Pss.Shopping.Api/Pss.Shopping.Api.csproj
        DLL: Pss.Shopping.Api.dll
    environment:
      <<: *service-env
    depends_on: [redis, rabbitmq]

  booking:
    build:
      context: .
      args:
        PROJECT: src/Services/Booking/Pss.Booking.Api/Pss.Booking.Api.csproj
        DLL: Pss.Booking.Api.dll
    environment:
      <<: *service-env
      ConnectionStrings__Sql: "Server=sqlserver,1433;Database=Pss_Booking;User Id=sa;Password=Pss_Dev_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
    depends_on: [redis, rabbitmq, sqlserver]

  payment:
    build:
      context: .
      args:
        PROJECT: src/Services/Payment/Pss.Payment.Api/Pss.Payment.Api.csproj
        DLL: Pss.Payment.Api.dll
    environment:
      <<: *service-env
      ConnectionStrings__Sql: "Server=sqlserver,1433;Database=Pss_Payment;User Id=sa;Password=Pss_Dev_Passw0rd!;TrustServerCertificate=True;Encrypt=False"
    depends_on: [redis, rabbitmq, sqlserver]

  notification:
    build:
      context: .
      args:
        PROJECT: src/Services/Notification/Pss.Notification.Api/Pss.Notification.Api.csproj
        DLL: Pss.Notification.Api.dll
    environment:
      <<: *service-env
      Smtp__Host: mailpit
      Smtp__Port: "1025"
    depends_on: [redis, rabbitmq]

  gateway:
    build:
      context: .
      args:
        PROJECT: src/Gateway/Pss.Gateway/Pss.Gateway.csproj
        DLL: Pss.Gateway.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seq__Url: http://seq:5341
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity:8080/
      ReverseProxy__Clusters__refdata__Destinations__d1__Address: http://refdata:8080/
      ReverseProxy__Clusters__inventory__Destinations__d1__Address: http://inventory:8080/
      ReverseProxy__Clusters__pricing__Destinations__d1__Address: http://pricing:8080/
      ReverseProxy__Clusters__shopping__Destinations__d1__Address: http://shopping:8080/
      ReverseProxy__Clusters__booking__Destinations__d1__Address: http://booking:8080/
      ReverseProxy__Clusters__payment__Destinations__d1__Address: http://payment:8080/
      ReverseProxy__Clusters__notification__Destinations__d1__Address: http://notification:8080/
    ports: ["5000:8080"]
    depends_on: [identity, refdata, shopping, booking, payment]

volumes:
  sqldata:
  identitykeys:
